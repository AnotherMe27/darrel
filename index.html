<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonia Ganda — Personal Brand</title>
  <meta name="description" content="The official personal brand website of Sonia Ganda.">
  <meta property="og:title" content="Sonia Ganda — Personal Brand">
  <meta property="og:description" content="Discover Sonia Ganda's work, story, and vision.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>SG</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap');

    :root{--ink:#18211f;--muted:#68706d;--cream:#f7f4ee;--sand:#e5d8c5;--accent:#a65d45;--white:#fff}
    *{box-sizing:border-box;margin:0}
    html{scroll-behavior:smooth}
    body{font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--cream);line-height:1.6}
    h1,h2,h3{font-family:"Playfair Display",serif;font-weight:500;line-height:1.1}
    h1{font-size:clamp(3.5rem,9vw,8rem)}
    h2{font-size:clamp(2.4rem,5vw,4.5rem)}
    a{color:inherit;text-decoration:none}
    img{display:block;width:100%;object-fit:cover}
    .container{width:min(1160px,calc(100% - 40px));margin:auto}
    .eyebrow{color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .button{display:inline-block;padding:14px 24px;border:1px solid var(--ink);font-size:.85rem;transition:.25s}
    .button:hover{background:var(--ink);color:var(--white);transform:translateY(-3px)}
    .button.primary{background:var(--ink);color:var(--white)}
    .button.primary:hover{background:var(--accent);border-color:var(--accent)}
    header{position:fixed;z-index:5;top:0;width:100%;background:#f7f4eef0;backdrop-filter:blur(14px);border-bottom:1px solid #18211f12}
    nav{height:78px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-family:"Playfair Display";font-size:1.5rem}
    .nav-links{display:flex;gap:30px;align-items:center;font-size:.82rem}
    .nav-links a:hover{color:var(--accent)}
    .menu{display:none;background:none;border:0;font-size:1.5rem}
    section{padding:120px 0}
    .hero{min-height:100vh;padding-top:150px;display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center}
    .hero p{max-width:500px;color:var(--muted);font-size:1.1rem;margin:28px 0}
    .actions{display:flex;gap:14px;flex-wrap:wrap}
    .hero-image{height:650px;position:relative}
    .hero-image img{height:100%;filter:saturate(.75)}
    .hero-image:after{content:"";position:absolute;inset:20px -20px -20px 20px;border:1px solid var(--accent);z-index:-1}
    .highlights{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sand);margin-top:70px}
    .highlight{background:var(--cream);padding:25px}
    .highlight strong{display:block;font:2.2rem "Playfair Display"}
    .highlight span{color:var(--muted);font-size:.8rem}
    .dark{background:var(--ink);color:var(--cream)}
    .about-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:100px;align-items:center}
    .about-grid img{height:520px}
    .about-copy p{color:#c4c9c5;margin:25px 0;max-width:570px}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:45px}
    .section-head p{color:var(--muted);max-width:350px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card{background:var(--white);transition:.3s}
    .card:hover{transform:translateY(-8px);box-shadow:0 18px 40px #18211f14}
    .card img{height:250px}
    .card-body{padding:24px}
    .card-body p{color:var(--muted);font-size:.9rem;margin:12px 0 20px}
    .card-body a{font-size:.8rem;color:var(--accent);font-weight:700}
    .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .gallery img{height:260px;cursor:pointer;transition:.3s}
    .gallery img:hover{opacity:.75}
    .timeline{border-left:1px solid var(--sand);max-width:760px;margin:auto}
    .milestone{padding:0 0 45px 35px;position:relative}
    .milestone:before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
    .milestone small{color:var(--accent);font-weight:700}
    .milestone p{color:var(--muted);margin-top:8px}
    .contact{display:grid;grid-template-columns:1fr 1fr;gap:80px}
    form{display:grid;gap:14px}
    input,textarea{width:100%;border:1px solid var(--sand);background:var(--white);padding:15px;font:inherit}
    textarea{min-height:140px;resize:vertical}
    .contact-info{color:var(--muted)}
    .contact-info p{margin:20px 0}
    footer{padding:35px 0;background:#111816;color:#bbc1bd;font-size:.8rem}
    .footer-row{display:flex;justify-content:space-between;gap:20px}
    .socials{display:flex;gap:18px}
    #lightbox{display:none;position:fixed;inset:0;background:#000c;z-index:10;place-items:center;padding:25px}
    #lightbox img{max-width:900px;max-height:85vh;width:auto}
    #lightbox button{position:absolute;right:25px;top:20px;background:none;color:white;border:0;font-size:2rem}
    @media(max-width:760px){
      .nav-links{display:none;position:absolute;top:78px;left:0;right:0;background:var(--cream);padding:25px;flex-direction:column;align-items:flex-start}
      .nav-links.open{display:flex}.menu{display:block}.hero,.about-grid,.contact{grid-template-columns:1fr;gap:45px}
      .hero{padding-top:125px}.hero-image{height:430px}.highlights,.cards{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}
      .gallery img{height:180px}.section-head,.footer-row{display:block}.section-head p{margin-top:15px}.footer-row>*{margin-bottom:15px}
    }
  </style>
</head>

    <nav class="container">
      <a class="logo" href="#home">Sonia Ganda</a>
      <button class="menu" aria-label="Open menu">☰</button>
      <div class="nav-links">
        <a href="#about">About</a><a href="#work">Work</a><a href="#gallery">Gallery</a>
        <a href="#achievements">Achievements</a><a class="button primary" href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main>

      <div>
        <div class="eyebrow">Personal brand · Official website</div>
        <h1>Sonia<br><i>Ganda.</i></h1>
        <p>A thoughtfully curated space for Sonia's story, ideas, work, and evolving vision.</p>
        <div class="actions"><a class="button primary" href="#about">Learn more</a><a class="button" href="#contact">Contact me</a></div>
        <div class="highlights">
          <div class="highlight"><strong>—</strong><span>Featured highlight</span></div>
          <div class="highlight"><strong>—</strong><span>Project milestone</span></div>
          <div class="highlight"><strong>—</strong><span>Current focus</span></div>
        </div>
      </div>
      <div class="hero-image"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85" alt="Sonia Ganda profile placeholder"></div>
    </section>

    <section class="dark" id="about">
      <
